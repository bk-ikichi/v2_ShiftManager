spring:
  application:
    name: shiftmanager
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/shiftmanager}
    username: ${DATABASE_USERNAME:shiftmanager}
    password: ${DATABASE_PASSWORD:shiftmanager}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  # remember-me Cookieの署名鍵。本番では必ず環境変数で上書きする
  remember-me-key: ${REMEMBER_ME_KEY:dev-only-remember-me-key}
  # スタッフ登録で初期パスワードを省略したときの共通の固定値。未設定だと起動しない
  staff-initial-password: ${STAFF_INITIAL_PASSWORD}

server:
  # HTTPS終端のリバースプロキシ配下でリダイレクト先をhttpsにするため
  forward-headers-strategy: framework
