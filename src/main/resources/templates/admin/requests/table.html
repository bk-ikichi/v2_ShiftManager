<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('申請一覧')}"></head>
<body class="min-h-screen bg-stone-50 text-stone-900">
<header th:replace="~{layout :: header}"></header>
<main class="mx-auto max-w-7xl px-4 py-6">
  <div class="mb-4 flex flex-wrap items-center gap-3">
    <h1 class="text-lg font-bold">申請一覧</h1>
    <a th:href="@{/admin/requests(date=${view.previousStart})}" class="btn-secondary px-3 py-1">&lt; 前</a>
    <span class="font-bold" th:text="${view.label}">10/1〜10/10</span>
    <a th:href="@{/admin/requests(date=${view.nextStart})}" class="btn-secondary px-3 py-1">次 &gt;</a>
    <span class="text-sm text-stone-600" th:text="|締切 ${view.deadlineLabel}|">締切 9/26（土）</span>
    <button type="button" data-copy-excel class="btn-secondary px-3 py-1 text-sm">Excel用にコピー</button>
    <span data-copy-message class="text-sm text-green-800" role="status"></span>
    <span data-order-message class="text-sm" role="status"></span>
    <span class="ml-auto flex items-center gap-1 text-sm">
      <span class="inline-block h-3 w-3 rounded border border-red-200 bg-red-100"></span>未提出
    </span>
  </div>
  <div th:replace="~{layout :: flash}"></div>

  <div class="overflow-x-auto rounded-lg border border-stone-200 bg-white">
    <!-- data-csrf-* はドラッグで変えた並び順の保存（fetch）で使う -->
    <table class="min-w-full border-collapse text-sm" th:data-order-url="@{/admin/requests/order}"
           th:data-csrf-header="${_csrf.headerName}" th:data-csrf-token="${_csrf.token}">
      <thead>
      <tr class="bg-stone-100">
        <th class="sticky left-0 z-10 bg-stone-100 px-3 py-2 text-left">名前</th>
        <!-- 日付から、その日の転記画面へ移動する -->
        <th th:each="date, s : ${view.dates}" class="whitespace-nowrap p-0">
          <a th:href="@{/admin/shifts(date=${date})}" th:text="${view.dateLabels[s.index]}"
             class="block px-2 py-2 text-amber-800 underline hover:bg-amber-50">1（木）</a>
        </th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${view.rows}" class="border-t border-stone-100" th:data-user-id="${row.userId}"
          th:classappend="${row.submitted} ? '' : 'bg-red-50'">
        <th class="sticky left-0 z-10 whitespace-nowrap py-2 pl-1 pr-3 text-left font-normal"
            th:classappend="${row.submitted} ? 'bg-white' : 'bg-red-50'">
          <div class="flex items-center gap-1">
            <!-- ここを掴んで行をドラッグし、並び順を変える（request-table.js） -->
            <span data-drag-handle title="ドラッグで並び替え" aria-hidden="true"
                  class="cursor-grab select-none px-1 text-stone-400 hover:text-stone-700">&#8801;</span>
            <div>
              <span th:text="${row.name}">山田太郎</span>
              <span class="block text-xs text-stone-500" th:text="${row.positionName}">キッチン</span>
              <span th:if="${row.unavailable}" class="block text-xs text-red-700">この期間は出勤できない</span>
            </div>
          </div>
        </th>
        <!-- data-start / data-end は「Excel用にコピー」で使う -->
        <td th:each="cell : ${row.cells}" class="relative min-w-20 p-0 text-center"
            th:data-start="${cell.startTime}" th:data-end="${cell.endTime}" data-cell>
          <a th:href="@{/admin/requests/edit(userId=${row.userId},date=${cell.date})}"
             class="block min-h-10 whitespace-nowrap py-2 pl-1 pr-4 text-xs tabular-nums hover:bg-amber-50">
            <th:block th:if="${cell.startTime != null}">
              <span th:text="${cell.startTime}">900</span><span class="px-0.5 text-stone-400">-</span><span th:text="${cell.endTime}">1700</span>
            </th:block>
          </a>
          <th:block th:if="${cell.note != null}" th:with="noteId=|note-${row.userId}-${cell.date}|">
            <button type="button" th:popovertarget="${noteId}" aria-label="備考を表示" data-note-button
                    class="absolute right-0.5 top-0.5 flex h-4 w-4 items-center justify-center rounded-full border border-amber-700 font-serif text-[10px] font-bold italic text-amber-700 hover:bg-amber-100">i</button>
            <!-- 吹き出し。位置と矢印の向きは request-table.js で i マークに合わせる -->
            <div popover th:id="${noteId}" data-note-popover
                 class="m-0 w-64 max-w-[85vw] overflow-visible rounded-lg border border-stone-300 bg-white p-3 text-left text-sm shadow-xl">
              <span data-arrow class="absolute h-3 w-3 rotate-45 border-stone-300 bg-white"></span>
              <p class="mb-2 font-bold">
                <span th:text="${row.name}">山田太郎</span>
                <span class="ml-2 font-normal text-stone-600" th:text="${#temporals.format(cell.date, 'M/d')}">10/2</span>
              </p>
              <p class="whitespace-pre-wrap break-words" th:text="${cell.note}">遅れるかも</p>
            </div>
          </th:block>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <p th:if="${#lists.isEmpty(view.rows)}" class="mt-4 text-sm text-stone-500">有効なスタッフがいません。</p>
  <p class="mt-2 text-xs text-stone-500">
    日付をクリックするとその日の転記画面、マスをクリックすると代理で編集できます（締切後も可）。i を押すと備考を表示します。<br>
    名前の左の ≡ をドラッグすると並び順を変えられます（PCのみ。自動で保存し、スタッフ管理画面の並び順にも使います）。<br>
    「Excel用にコピー」は時刻だけ（1日につきIN・OUTの2列、表示中の並び順）をコピーします。休みの日は空欄になります。
  </p>
</main>
<script th:src="@{/js/request-table.js}" defer></script>
</body>
</html>
