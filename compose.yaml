services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: shiftmanager
      POSTGRES_USER: shiftmanager
      POSTGRES_PASSWORD: shiftmanager
    # PCにインストール済みのPostgreSQLが5432を使っているため5433で公開する
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
